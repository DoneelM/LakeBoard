title: Artifact Demo
description: Orders by region and market segment, 1992 to 1997. A page written the way a Claude Dashboard artifact is, running unchanged in the portal.
owner: Samples
section: Samples
order: 90
groups: []                # everyone who can use the portal; this is public sample data
page: artifact            # run index.html as a Claude Dashboard artifact (decision 0011); files in assets/
# Both datasets read samples.tpch, Databricks sample data that every workspace user can read and that has no
# row-level security, so one cached result can safely be shared by all viewers (cache: shared). The data never
# changes, so the TTL is long; Refresh data still re-runs a query on demand.
datasets:
  yearly:
    title: Revenue by region and year
    description: Order revenue and order count per region and order year, 1992 to 1997 (30 rows).
    sql: sql/yearly.sql
    cache: shared
    cache_ttl: 24h
    source: "Databricks sample data (samples.tpch), a fixed TPC-H data set."
  segments:
    title: Revenue by region and market segment
    description: Order revenue, orders and customers per region and customer market segment, 1992 to 1997 (25 rows).
    sql: sql/segments.sql
    cache: shared
    cache_ttl: 24h
    source: "Databricks sample data (samples.tpch), a fixed TPC-H data set."
